<!doctype html>
<html lang="en">
<head>
  <script>
    // Paths are relative to this page.
    const CLUBLIST_PATH = "clublist.yml";
    const IMAGE_PATH = "images/";
  </script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Yacht Club Burgees</title>
  <link rel="icon" href="favicon.ico" sizes="any">
  <style>
    :root {
      color-scheme: light;
      --surface-0: #f3f3f0;
      --surface-1: #fcfcfb;
      --border: #dcdbd5;
      --grid: #e7e6e1;
      --text-primary: #0b0b0b;
      --text-secondary: #52514e;
      --text-muted: #6e6d68;
      --accent: #1c63ba;
      --series-1: #2a78d6;
      --series-2: #eb6834;
      --series-3: #1baf7a;
      --on-series-1: #ffffff;
      --on-series-2: #0b0b0b;
      --on-series-3: #0b0b0b;
    }
    @media (prefers-color-scheme: dark) {
      :root:where(:not([data-theme="light"])) {
        color-scheme: dark;
        --surface-0: #121211;
        --surface-1: #1a1a19;
        --border: #3a3a37;
        --grid: #2c2c2a;
        --text-primary: #f0efec;
        --text-secondary: #c3c2b7;
        --text-muted: #a3a298;
        --accent: #7db2f0;
        --series-1: #3987e5;
        --series-2: #d95926;
        --series-3: #199e70;
        --on-series-1: #0b0b0b;
        --on-series-2: #0b0b0b;
        --on-series-3: #0b0b0b;
      }
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --surface-0: #121211;
      --surface-1: #1a1a19;
      --border: #3a3a37;
      --grid: #2c2c2a;
      --text-primary: #f0efec;
      --text-secondary: #c3c2b7;
      --text-muted: #a3a298;
      --accent: #7db2f0;
      --series-1: #3987e5;
      --series-2: #d95926;
      --series-3: #199e70;
      --on-series-1: #0b0b0b;
      --on-series-2: #0b0b0b;
      --on-series-3: #0b0b0b;
    }

    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      background: var(--surface-0);
      color: var(--text-primary);
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    a { color: var(--accent); }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .site-header { background: var(--surface-1); border-bottom: 1px solid var(--border); }
    .site-header-inner, main { max-width: 1120px; margin: 0 auto; padding-inline: 16px; }
    .site-header-inner {
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
      gap: 4px 24px; padding-block: 12px;
    }
    .brand { font-size: 18px; font-weight: 650; }
    .site-nav { display: flex; gap: 20px; }
    .site-nav a { color: var(--text-secondary); text-decoration: none; padding-block: 4px; }
    .site-nav a:hover { color: var(--text-primary); text-decoration: underline; }
    .site-nav a[aria-current="page"] { color: var(--text-primary); font-weight: 600; border-bottom: 2px solid var(--accent); }
    main { padding-block: 32px 64px; }
    .site-footer { max-width: 1120px; margin: 0 auto; padding: 0 16px 32px; color: var(--text-muted); font-size: 14px; }
    .site-footer p { margin: 0; border-top: 1px solid var(--border); padding-top: 16px; }
    h1 { font-size: 30px; line-height: 1.2; margin: 0 0 8px; }
    .lede { color: var(--text-secondary); margin: 0 0 24px; }
    .notice {
      background: var(--surface-1); border: 1px solid var(--border); border-radius: 8px;
      padding: 16px; color: var(--text-secondary);
    }
    .notice code { color: var(--text-primary); }

    /* Search */
    .search-label { display: block; font-weight: 600; margin-bottom: 6px; }
    .search-input {
      width: 100%; font: inherit; font-size: 18px; color: var(--text-primary);
      background: var(--surface-1); border: 1px solid var(--text-muted); border-radius: 8px;
      padding: 12px 14px;
    }
    .result-count { color: var(--text-secondary); min-height: 24px; margin: 12px 0 16px; }
    .cards {
      list-style: none; margin: 0; padding: 0; display: grid; gap: 16px;
      grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr));
    }
    .card {
      display: flex; flex-direction: column; min-width: 0;
      background: var(--surface-1); border: 1px solid var(--border); border-radius: 8px; overflow: hidden;
    }
    .card-burgee {
      height: 180px; display: flex; align-items: center; justify-content: center;
      background: #ffffff; border-bottom: 1px solid var(--border);
    }
    .card-burgee img { width: 170px; height: 170px; object-fit: contain; display: block; }
    .card-burgee.is-empty { background: var(--surface-0); color: var(--text-muted); font-size: 14px; }
    .card-body { padding: 16px; }
    .card h2 { font-size: 19px; line-height: 1.25; margin: 0 0 12px; overflow-wrap: anywhere; }
    .facts { margin: 0; display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 12px; font-size: 15px; }
    .facts dt { color: var(--text-muted); }
    .facts dd { margin: 0; overflow-wrap: anywhere; }
    .burgee-desc { color: var(--text-secondary); font-size: 14px; margin: 12px 0 0; }

    /* Statistics */
    .stats-heading { font-size: 24px; line-height: 1.2; margin: 8px 0 16px; }
    .stat-section { margin-top: 40px; }
    .stat-section h2 { font-size: 21px; margin: 0 0 4px; }
    .stat-section .note { color: var(--text-secondary); margin: 0 0 16px; font-size: 15px; }
    .tiles { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 148px), 1fr)); }
    .tile { background: var(--surface-1); border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px; }
    .tile .value { font-size: 34px; font-weight: 650; line-height: 1.15; font-variant-numeric: tabular-nums; }
    .tile .label { color: var(--text-secondary); font-size: 14px; }
    .tile .sub { color: var(--text-muted); font-size: 13px; }
    .panel { background: var(--surface-1); border: 1px solid var(--border); border-radius: 8px; padding: 16px; }
    .two-col { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); align-items: start; }
    .panel h3 { font-size: 16px; margin: 0 0 12px; }

    .seg { display: flex; gap: 2px; height: 28px; }
    .seg-part {
      border-radius: 4px; min-width: 2px; padding-inline: 8px; font-size: 13px; font-weight: 600;
      line-height: 28px; white-space: nowrap; overflow: hidden; font-variant-numeric: tabular-nums;
    }
    .legend { display: flex; flex-wrap: wrap; gap: 4px 16px; margin: 10px 0 12px; font-size: 14px; color: var(--text-secondary); }
    .legend-item { display: inline-flex; align-items: center; gap: 6px; }
    .swatch { width: 12px; height: 12px; border-radius: 3px; flex: none; }

    .hbars { display: grid; gap: 6px; }
    .hbar { display: grid; grid-template-columns: minmax(84px, 150px) minmax(0, 1fr); gap: 10px; align-items: center; font-size: 14px; }
    .hbar-label { color: var(--text-secondary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .hbar-track { display: flex; align-items: center; gap: 6px; min-width: 0; }
    .hbar-fill { height: 14px; min-width: 2px; background: var(--series-1); border-radius: 0 4px 4px 0; }
    .hbar-value { color: var(--text-primary); font-variant-numeric: tabular-nums; white-space: nowrap; }

    .columns { display: flex; align-items: flex-end; gap: 2px; height: 180px; border-bottom: 1px solid var(--text-muted); }
    .col { flex: 1 1 0; min-width: 0; height: 100%; display: flex; align-items: flex-end; }
    .col-fill { width: 100%; max-width: 24px; margin-inline: auto; min-height: 1px; background: var(--series-1); border-radius: 4px 4px 0 0; }
    .col.is-empty .col-fill { background: transparent; }
    .col-axis { display: flex; justify-content: space-between; color: var(--text-muted); font-size: 13px; margin-top: 4px; }

    .table-wrap { overflow-x: auto; }
    table { border-collapse: collapse; width: 100%; font-size: 14px; }
    th, td { text-align: left; padding: 6px 12px 6px 0; border-bottom: 1px solid var(--grid); vertical-align: top; }
    th { color: var(--text-muted); font-weight: 600; }
    td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; padding-right: 0; padding-left: 12px; }
    details { margin-top: 12px; }
    summary { cursor: pointer; color: var(--text-secondary); font-size: 14px; }
    details .table-wrap { margin-top: 8px; }

    .tooltip {
      position: fixed; z-index: 10; pointer-events: none; max-width: 260px;
      background: var(--text-primary); color: var(--surface-1); font-size: 13px;
      padding: 6px 8px; border-radius: 4px;
    }
    @media (max-width: 480px) {
      h1 { font-size: 26px; }
      .tile .value { font-size: 28px; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="site-header-inner">
      <div class="brand">Yacht Club Burgees</div>
      <nav class="site-nav" aria-label="Project">
        <a href="https://github.com/edguy3/yachtclublist/blob/HEAD/LICENSE">Open Data (MIT License)</a>
        <a href="https://github.com/edguy3/yachtclublist">GitHub Source Data</a>
      </nav>
    </div>
  </header>
  <main>
    <h1>Find a club</h1>
    <p class="lede" id="lede">Loading the club list…</p>
    <label class="search-label" for="search">Club name</label>
    <input class="search-input" id="search" type="search" autocomplete="off" spellcheck="false" autofocus
           placeholder="Start typing, for example Newport" aria-controls="results">
    <p class="result-count" id="count" role="status"></p>
    <ul class="cards" id="results"></ul>
    <section id="stats-panel" aria-labelledby="stats-heading" hidden>
      <h2 class="stats-heading" id="stats-heading">Club list statistics</h2>
      <div id="stats"></div>
    </section>
  </main>
  <footer class="site-footer">
    <p>The MIT License covers the data and code. Burgee images and crests remain the property of their clubs.</p>
  </footer>

  </script>
  <script>
    /* Loads clublist.yml and normalizes each club for the search and statistics pages. */
    (function () {
      function parseFounded(value) {
        if (typeof value === "number") return { kind: "exact", year: value, label: String(value) };
        const text = String(value ?? "").trim();
        const about = text.match(/^about\s+(\d{4})$/i);
        if (about) return { kind: "about", year: Number(about[1]), label: "about " + about[1] };
        if (/^\d{4}$/.test(text)) return { kind: "exact", year: Number(text), label: text };
        return { kind: "unknown", year: null, label: "Unknown" };
      }

      function decimals(number) {
        const part = String(number).split(".")[1];
        return part ? part.length : 0;
      }

      /* Town-level coordinates are stored with 2 decimals; points have up to 5. */
      function coordinatePrecision(coordinates) {
        if (!Array.isArray(coordinates) || coordinates.length !== 2) return "none";
        return Math.max(decimals(coordinates[0]), decimals(coordinates[1])) >= 3 ? "point" : "town";
      }

      function fold(text) {
        return String(text).normalize("NFKD").replace(/[̀-ͯ]/g, "").toLowerCase()
          .replace(/&/g, " and ").replace(/[^a-z0-9]+/g, " ").trim();
      }

      function normalize(entry, imagePath) {
        const coordinates = Array.isArray(entry.coordinates) ? entry.coordinates : null;
        return {
          name: entry.name,
          city: entry.city || "",
          state: entry.state || "",
          country: entry.country || "",
          founded: parseFounded(entry.founded),
          website: entry.website || "",
          coordinates,
          precision: coordinatePrecision(coordinates),
          burgee: entry.burgee ? imagePath + entry.burgee : "",
          description: entry.description || "",
          searchName: fold(entry.name),
        };
      }

      async function load(listPath, imagePath) {
        const response = await fetch(listPath, { cache: "no-cache" });
        if (!response.ok) throw new Error("Could not load " + listPath + " (" + response.status + ")");
        const data = jsyaml.load(await response.text());
        return data.filter((entry) => entry && entry.name).map((entry) => normalize(entry, imagePath));
      }

      function showLoadError(target, error) {
        const box = document.createElement("div");
        box.className = "notice";
        box.append("The club list could not be loaded. These pages need a local web server: run ");
        const code = document.createElement("code");
        code.textContent = "make serve";
        box.append(code, " from the repository, then open http://localhost:8000/. (" + error.message + ")");
        target.replaceChildren(box);
      }

      window.ClubData = { load, fold, showLoadError };
    })();

    (function () {
      let root;
      const tooltip = document.createElement("div");
      tooltip.className = "tooltip";
      tooltip.hidden = true;
      document.body.append(tooltip);

      function el(tag, className, text) {
        const node = document.createElement(tag);
        if (className) node.className = className;
        if (text !== undefined) node.textContent = text;
        return node;
      }
      const fmt = (n) => n.toLocaleString("en-US");
      const pct = (n, total) => {
        if (!total) return "0%";
        const value = (n / total) * 100;
        const nearEdge = (value > 0 && value < 1) || (value > 99 && value < 100);
        return (nearEdge ? value.toFixed(1) : Math.round(value)) + "%";
      };
      function tally(items, keyOf) {
        const counts = new Map();
        for (const item of items) {
          const key = keyOf(item);
          if (key) counts.set(key, (counts.get(key) || 0) + 1);
        }
        return [...counts].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));
      }

      function tip(node, text) {
        node.dataset.tip = text;
        node.setAttribute("aria-label", text);
        node.tabIndex = 0;
        return node;
      }
      function placeTip(x, y) {
        const box = tooltip.getBoundingClientRect();
        tooltip.style.left = Math.max(8, Math.min(innerWidth - box.width - 8, x + 12)) + "px";
        tooltip.style.top = Math.max(8, y - box.height - 10) + "px";
      }
      function showTip(target, x, y) {
        tooltip.textContent = target.dataset.tip;
        tooltip.hidden = false;
        placeTip(x, y);
      }
      document.addEventListener("pointerover", (event) => {
        const target = event.target.closest("[data-tip]");
        if (target) showTip(target, event.clientX, event.clientY);
        else tooltip.hidden = true;
      });
      document.addEventListener("pointermove", (event) => { if (!tooltip.hidden) placeTip(event.clientX, event.clientY); });
      document.addEventListener("focusin", (event) => {
        const target = event.target.closest("[data-tip]");
        if (!target) return;
        const box = target.getBoundingClientRect();
        showTip(target, box.left, box.top);
      });
      document.addEventListener("focusout", () => { tooltip.hidden = true; });

      function section(title, note) {
        const box = el("section", "stat-section");
        box.append(el("h2", "", title));
        if (note) box.append(el("p", "note", note));
        root.append(box);
        return box;
      }
      function panel(parent, title) {
        const box = el("div", "panel");
        if (title) box.append(el("h3", "", title));
        parent.append(box);
        return box;
      }

      function table(headers, rows, numeric) {
        const wrap = el("div", "table-wrap");
        const tbl = el("table");
        const head = el("tr");
        headers.forEach((text, i) => head.append(Object.assign(el("th", numeric[i] ? "num" : "", text), { scope: "col" })));
        const thead = el("thead");
        thead.append(head);
        const body = el("tbody");
        for (const row of rows) {
          const tr = el("tr");
          row.forEach((cell, i) => {
            const td = el("td", numeric[i] ? "num" : "");
            td.append(cell);
            tr.append(td);
          });
          body.append(tr);
        }
        tbl.append(thead, body);
        wrap.append(tbl);
        return wrap;
      }

      /* One whole split into parts: blocks in the first three series colors, legend, then a table. */
      function segmented(parent, parts) {
        const total = parts.reduce((sum, part) => sum + part.count, 0);
        const bar = el("div", "seg");
        parts.filter((part) => part.count).forEach((part, index) => {
          const slot = parts.indexOf(part) + 1;
          const block = el("div", "seg-part");
          const share = part.count / total;
          block.style.flex = share + " 1 0";
          block.style.background = "var(--series-" + slot + ")";
          block.style.color = "var(--on-series-" + slot + ")";
          if (share >= 0.08) block.textContent = pct(part.count, total);
          tip(block, part.label + ": " + fmt(part.count) + " (" + pct(part.count, total) + ")");
          bar.append(block);
        });
        const legend = el("div", "legend");
        parts.forEach((part, index) => {
          const item = el("span", "legend-item");
          const swatch = el("span", "swatch");
          swatch.style.background = "var(--series-" + (index + 1) + ")";
          item.append(swatch, part.label);
          legend.append(item);
        });
        parent.append(bar, legend,
          table(["Level", "Clubs", "Share"], parts.map((p) => [p.detail || p.label, fmt(p.count), pct(p.count, total)]), [false, true, true]));
      }

      function hbars(parent, rows) {
        const max = Math.max(...rows.map((row) => row.count), 1);
        const list = el("div", "hbars");
        for (const row of rows) {
          const line = el("div", "hbar");
          line.append(Object.assign(el("div", "hbar-label", row.label), { title: row.label }));
          const track = el("div", "hbar-track");
          const fill = el("div", "hbar-fill");
          fill.style.width = "calc((100% - 56px) * " + row.count / max + ")";
          tip(fill, row.tip || row.label + ": " + fmt(row.count));
          track.append(fill, el("span", "hbar-value", fmt(row.count)));
          line.append(track);
          list.append(line);
        }
        parent.append(list);
      }

      function regionTable(clubs, keyOf) {
        const rows = tally(clubs, keyOf).map(([name, count]) => {
          const group = clubs.filter((club) => keyOf(club) === name);
          const burgees = group.filter((club) => club.burgee).length;
          return [name, fmt(count), fmt(burgees), pct(burgees, count)];
        });
        return table(["Name", "Clubs", "With burgee", "Burgee share"], rows, [false, true, true, true]);
      }

      function regionPanel(parent, title, clubs, keyOf, top) {
        const box = panel(parent, title);
        const all = tally(clubs, keyOf);
        hbars(box, all.slice(0, top).map(([label, count]) => {
          const burgees = clubs.filter((club) => keyOf(club) === label && club.burgee).length;
          return { label, count, tip: label + ": " + fmt(count) + " clubs, " + fmt(burgees) + " with a burgee" };
        }));
        const more = el("details");
        more.append(el("summary", "", "All " + fmt(all.length) + " with burgee coverage"), regionTable(clubs, keyOf));
        box.append(more);
      }

      function render(clubs, target) {
        root = target;
        root.replaceChildren();
        const total = clubs.length;
        const count = (test) => clubs.filter(test).length;
        const withBurgee = count((c) => c.burgee);
        const exactYear = count((c) => c.founded.kind === "exact");
        const aboutYear = count((c) => c.founded.kind === "about");
        const point = count((c) => c.precision === "point");
        const town = count((c) => c.precision === "town");
        const countries = tally(clubs, (c) => c.country);
        const usa = clubs.filter((c) => c.country === "USA");
        const usStates = tally(usa, (c) => c.state);

        const tiles = el("div", "tiles");
        [
          [fmt(total), "Clubs", ""],
          [fmt(withBurgee), "With a burgee image", pct(withBurgee, total) + " of clubs"],
          [fmt(point), "Located to a point", pct(point, total) + " of clubs"],
          [fmt(exactYear), "Exact founding year", pct(exactYear, total) + " of clubs"],
          [fmt(countries.length), "Countries", fmt(total - usa.length) + " clubs outside the USA"],
          [fmt(usStates.length), "US states and territories", fmt(usa.length) + " US clubs"],
        ].forEach(([value, label, sub]) => {
          const tile = el("div", "tile");
          tile.append(el("div", "value", value), el("div", "label", label));
          if (sub) tile.append(el("div", "sub", sub));
          tiles.append(tile);
        });
        root.append(tiles);

        const fields = section("Field completeness", "Only a name and a website are required, so other fields can be blank.");
        const fieldRows = [
          ["Name", count((c) => c.name)], ["Website", count((c) => c.website)], ["Country", count((c) => c.country)],
          ["State or region", count((c) => c.state)], ["City", count((c) => c.city)], ["Coordinates", count((c) => c.coordinates)],
          ["Founding date, exact or approximate", count((c) => c.founded.kind !== "unknown")],
          ["Burgee image", withBurgee], ["Burgee description", count((c) => c.description)],
        ];
        panel(fields).append(table(["Field", "Clubs", "Missing", "Complete"],
          fieldRows.map(([name, n]) => [name, fmt(n), fmt(total - n), pct(n, total)]), [false, true, true, true]));

        const precision = section("Location precision", "Based on how coordinates are recorded. A point is not proof of accuracy: some may be a mailing address.");
        const precisionGrid = el("div", "two-col");
        precision.append(precisionGrid);
        segmented(panel(precisionGrid, "Coordinates"), [
          { label: "Point", detail: "Point (3 or more decimals), about 100 m or better", count: point },
          { label: "Town-level", detail: "Town-level (2 decimals), about 1 km", count: town },
          { label: "None", detail: "No coordinates", count: total - point - town },
        ]);
        const fullPlace = count((c) => c.city && c.state && c.country);
        const noCity = count((c) => !c.city && c.state);
        segmented(panel(precisionGrid, "Written address"), [
          { label: "City and state", detail: "City, state or region, and country", count: fullPlace },
          { label: "State only", detail: "State or region, no city", count: noCity },
          { label: "Less", detail: "Country only, or city with no state", count: total - fullPlace - noCity },
        ]);

        const founded = section("Founding dates");
        const foundedGrid = el("div", "two-col");
        founded.append(foundedGrid);
        segmented(panel(foundedGrid, "How exact the date is"), [
          { label: "Exact year", count: exactYear },
          { label: "About", detail: "About a year", count: aboutYear },
          { label: "Unknown", count: total - exactYear - aboutYear },
        ]);
        const dated = clubs.filter((c) => c.founded.year);
        const decadesPanel = panel(foundedGrid, "Clubs founded by decade");
        const firstDecade = Math.floor(Math.min(...dated.map((c) => c.founded.year)) / 10) * 10;
        const lastDecade = Math.floor(Math.max(...dated.map((c) => c.founded.year)) / 10) * 10;
        const decadeRows = [];
        for (let decade = firstDecade; decade <= lastDecade; decade += 10) {
          decadeRows.push([decade, dated.filter((c) => Math.floor(c.founded.year / 10) * 10 === decade).length]);
        }
        const peak = Math.max(...decadeRows.map((row) => row[1]));
        const columns = el("div", "columns");
        for (const [decade, n] of decadeRows) {
          const col = el("div", "col" + (n ? "" : " is-empty"));
          const fill = el("div", "col-fill");
          fill.style.height = (n / peak) * 100 + "%";
          tip(col, decade + "s: " + fmt(n) + (n === 1 ? " club" : " clubs"));
          col.append(fill);
          columns.append(col);
        }
        const axis = el("div", "col-axis");
        axis.append(el("span", "", firstDecade + "s"), el("span", "", lastDecade + "s"));
        const decadeDetails = el("details");
        decadeDetails.append(el("summary", "", "Show as a table"),
          table(["Decade", "Clubs"], decadeRows.filter((row) => row[1]).map(([decade, n]) => [decade + "s", fmt(n)]), [false, true]));
        decadesPanel.append(columns, axis, el("p", "note", "Includes approximate years. Peak: " +
          decadeRows.find((row) => row[1] === peak)[0] + "s, " + fmt(peak) + " clubs."), decadeDetails);

        const oldest = [...dated].sort((a, b) => a.founded.year - b.founded.year || a.name.localeCompare(b.name)).slice(0, 10);
        panel(founded, "Oldest clubs").append(table(["Club", "Location", "Founded"],
          oldest.map((c) => [c.name, [c.city, c.state || c.country].filter(Boolean).join(", "), c.founded.label]), [false, false, true]));
        founded.lastChild.style.marginTop = "16px";

        const where = section("Where the clubs are");
        const whereGrid = el("div", "two-col");
        where.append(whereGrid);
        regionPanel(whereGrid, "Top countries", clubs, (c) => c.country, 10);
        regionPanel(whereGrid, "Top US states", usa, (c) => c.state, 10);

        const burgees = section("Burgees");
        const crest = count((c) => /\bcrest\b/i.test(c.description));
        segmented(panel(burgees), [
          { label: "With image", detail: "Burgee image on file", count: withBurgee },
          { label: "No image", detail: "No burgee found", count: total - withBurgee },
        ]);
        burgees.append(Object.assign(el("p", "note", fmt(crest) + " images are described as crests or include one, rather than being a plain burgee."), { style: "margin-top:12px" }));

        const sites = section("Websites");
        const host = (c) => { try { return new URL(c.website).hostname.replace(/^www\./, ""); } catch { return ""; } };
        const platforms = [["ClubExpress", /clubexpress\.com$/], ["Wild Apricot", /wildapricot\.org$/], ["Wix", /wixsite\.com$/],
          ["Google Sites", /^sites\.google\.com$/], ["Facebook", /facebook\.com$/], ["Own domain or other", /./]];
        const platformOf = (c) => { const name = host(c); return (platforms.find(([, test]) => test.test(name)) || [""])[0]; };
        const https = count((c) => /^https:/i.test(c.website));
        const sitesGrid = el("div", "two-col");
        sites.append(sitesGrid);
        segmented(panel(sitesGrid, "Connection"), [
          { label: "HTTPS", count: https },
          { label: "HTTP", detail: "Plain HTTP", count: total - https },
        ]);
        const hostBox = panel(sitesGrid, "Hosting platform");
        hostBox.append(table(["Platform", "Clubs", "Share"],
          tally(clubs, platformOf).map(([name, n]) => [name, fmt(n), pct(n, total)]), [false, true, true]));
      }

      window.ClubStats = { render };
    })();

    (function () {
      const MAX_RESULTS = 5;
      const input = document.getElementById("search");
      const results = document.getElementById("results");
      const count = document.getElementById("count");
      const lede = document.getElementById("lede");
      const statsPanel = document.getElementById("stats-panel");
      let clubs = [];

      function el(tag, className, text) {
        const node = document.createElement(tag);
        if (className) node.className = className;
        if (text !== undefined) node.textContent = text;
        return node;
      }

      function terms(query) {
        return ClubData.fold(query.replace(/\byc\b/gi, "yacht club").replace(/\bsc\b/gi, "sailing club"))
          .split(" ").filter(Boolean);
      }

      /* Lower is better: name starts with the query, then a word does, then anywhere. */
      function rank(club, words) {
        const name = club.searchName;
        const parts = name.split(" ");
        if (!words.every((word) => name.includes(word))) return -1;
        const phrase = words.join(" ");
        if (name.startsWith(phrase)) return 0;
        if (name.includes(" " + phrase)) return 1;
        if (words.every((word) => parts.some((part) => part.startsWith(word)))) return 2;
        return 3;
      }

      function matches(query) {
        const words = terms(query);
        if (!words.length) return [];
        return clubs
          .map((club) => ({ club, score: rank(club, words) }))
          .filter((match) => match.score >= 0)
          .sort((a, b) => a.score - b.score || a.club.name.length - b.club.name.length ||
            a.club.name.localeCompare(b.club.name))
          .map((match) => match.club);
      }

      function fact(list, term, value) {
        list.append(el("dt", "", term));
        const dd = el("dd");
        dd.append(value);
        list.append(dd);
      }

      function externalLink(href, text) {
        const link = el("a", "", text);
        link.href = href;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        return link;
      }

      function burgeePanel(club) {
        const panel = el("div", "card-burgee");
        if (!club.burgee) {
          panel.classList.add("is-empty");
          panel.textContent = "No burgee on file";
          return panel;
        }
        const image = el("img");
        image.src = club.burgee;
        image.alt = club.description || "Burgee of " + club.name;
        image.loading = "lazy";
        image.addEventListener("error", () => {
          panel.classList.add("is-empty");
          panel.textContent = "Burgee image missing";
        });
        panel.append(image);
        return panel;
      }

      function coordinatesFact(club) {
        if (!club.coordinates) return "Not known";
        const [lat, lng] = club.coordinates;
        const span = document.createElement("span");
        span.append(externalLink(
          "https://www.openstreetmap.org/?mlat=" + lat + "&mlon=" + lng + "#map=15/" + lat + "/" + lng,
          lat + ", " + lng));
        if (club.precision === "town") span.append(" (town-level)");
        return span;
      }

      function card(club) {
        const item = el("li", "card");
        item.append(burgeePanel(club));
        const body = el("div", "card-body");
        body.append(el("h2", "", club.name));
        const facts = el("dl", "facts");
        const region = [club.city, club.state].filter(Boolean).join(", ");
        fact(facts, "Location", region || "Not known");
        fact(facts, "Country", club.country || "Not known");
        fact(facts, "Founded", club.founded.label);
        fact(facts, "Coordinates", coordinatesFact(club));
        if (/^https?:\/\//i.test(club.website)) {
          fact(facts, "Website", externalLink(club.website, club.website.replace(/^https?:\/\/(www\.)?/i, "").replace(/\/$/, "")));
        }
        body.append(facts);
        if (club.description) body.append(el("p", "burgee-desc", club.description));
        item.append(body);
        return item;
      }

      function render() {
        const query = input.value;
        statsPanel.hidden = Boolean(query.trim());
        const found = matches(query);
        results.replaceChildren(...found.slice(0, MAX_RESULTS).map(card));
        if (!query.trim()) count.textContent = "";
        else if (!found.length) count.textContent = "No club names match “" + query.trim() + "”.";
        else if (found.length <= MAX_RESULTS) count.textContent = found.length === 1 ? "1 match" : found.length + " matches";
        else count.textContent = "First " + MAX_RESULTS + " of " + found.length.toLocaleString() + " matches";
        const url = new URL(location.href);
        if (query.trim()) url.searchParams.set("q", query.trim());
        else url.searchParams.delete("q");
        history.replaceState(null, "", url);
      }

      ClubData.load(CLUBLIST_PATH, IMAGE_PATH).then((loaded) => {
        clubs = loaded;
        ClubStats.render(clubs, document.getElementById("stats"));
        lede.textContent = "Search " + clubs.length.toLocaleString() + " yacht and boat clubs by name.";
        input.value = new URLSearchParams(location.search).get("q") || "";
        input.addEventListener("input", render);
        render();
      }).catch((error) => ClubData.showLoadError(results.parentElement.querySelector("#count"), error));
    })();
  </script>
</body>
</html>
