<!doctype html>
<html lang="en">
<head>
  <script>
    // Paths are relative to this page.
    const CLUBLIST_PATH = "../clublist.yml";
    const IMAGE_PATH = "../images/";
  </script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Club List Statistics</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="site-header-inner">
      <div class="brand">Yacht Club Burgees</div>
      <nav class="site-nav" aria-label="Pages">
        <a href="index.html">Search</a>
        <a href="stats.html" aria-current="page">Statistics</a>
      </nav>
    </div>
  </header>
  <main>
    <h1>Club list statistics</h1>
    <p class="lede">Worked out from <code>clublist.yml</code> each time this page loads.</p>
    <div id="stats"></div>
  </main>
  <script src="vendor/js-yaml.min.js"></script>
  <script src="clubs.js"></script>
  <script src="stats.js"></script>
  <script>
    const statsRoot = document.getElementById("stats");
    ClubData.load(CLUBLIST_PATH, IMAGE_PATH)
      .then((clubs) => ClubStats.render(clubs, statsRoot))
      .catch((error) => ClubData.showLoadError(statsRoot, error));
  </script>
</body>
</html>
