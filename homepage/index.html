<!doctype html>
<html lang="en">
<head>
  <script>
    // Paths are relative to this page.
    const CLUBLIST_PATH = "../clublist.yml";
    const IMAGE_PATH = "../images/";
  </script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Club Search</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="site-header-inner">
      <div class="brand">Yacht Club Burgees</div>
      <nav class="site-nav" aria-label="Pages">
        <a href="index.html" aria-current="page">Search</a>
        <a href="stats.html">Statistics</a>
      </nav>
    </div>
  </header>
  <main>
    <h1>Find a club</h1>
    <p class="lede" id="lede">Loading the club list…</p>
    <label class="search-label" for="search">Club name</label>
    <input class="search-input" id="search" type="search" autocomplete="off" spellcheck="false" autofocus
           placeholder="Start typing, for example Newport" aria-controls="results">
    <p class="result-count" id="count" role="status"></p>
    <ul class="cards" id="results"></ul>
    <section id="stats-panel" aria-labelledby="stats-heading" hidden>
      <h2 class="stats-heading" id="stats-heading">Club list statistics</h2>
      <div id="stats"></div>
    </section>
  </main>
  <script src="vendor/js-yaml.min.js"></script>
  <script src="clubs.js"></script>
  <script src="stats.js"></script>
  <script src="index.js"></script>
</body>
</html>
